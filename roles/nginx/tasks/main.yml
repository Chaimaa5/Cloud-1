---
# Tasks for Nginx installation and setup
- name: Install Nginx
  apt:
    name: nginx
    state: present
  become: yes

- name: Ensure Nginx is running
  service:
    name: nginx
    state: started
    enabled: yes
  become: yes

- name: Deploy custom Nginx config for domain
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: Reload Nginx
  become: yes
