---
# Webserver (Nginx) Configuration Role
- name: Create nginx directory
  file:
    path: "{{ app_nginx_dir }}"
    state: directory
    mode: '0755'

- name: Copy nginx configuration
  template:
    src: nginx.conf.j2
    dest: "{{ app_nginx_dir }}/nginx.conf"
    mode: '0644'
  notify: restart nginx

- name: Configure UFW firewall
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { rule: 'allow', port: '22', proto: 'tcp' }
    - { rule: 'allow', port: '80', proto: 'tcp' }
    - { rule: 'allow', port: '443', proto: 'tcp' }
  when: ansible_facts['os_family'] == "Debian"

- name: Enable UFW
  ufw:
    state: enabled
  when: ansible_facts['os_family'] == "Debian"

- name: Display deployment information
  debug:
    msg:
      - "=========================================="
      - "WordPress deployment completed successfully!"
      - "=========================================="
      - "WordPress URL: https://{{ domain_name }}"
      - "PHPMyAdmin URL: https://pma.{{ domain_name }}"
      - "Admin User: {{ wordpress_admin_user }}"
      - "Admin Password: {{ wordpress_admin_password }}"
      - "=========================================="
      - "Note: Using self-signed certificate."
      - "Accept security warning in browser."
      - "=========================================="