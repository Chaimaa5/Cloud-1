---
# phpMyAdmin Configuration Role
- name: Ensure phpMyAdmin is defined in docker-compose
  debug:
    msg: "phpMyAdmin container will be started by docker-compose"

- name: Wait for phpMyAdmin container to be healthy
  shell: docker ps --filter "name=phpmyadmin" --filter "status=running" --format "{{'{{'}} .Names {{'}}'}}"
  register: phpmyadmin_status
  retries: 10
  delay: 5
  until: "'phpmyadmin' in phpmyadmin_status.stdout"
  ignore_errors: yes

- name: Display phpMyAdmin access information
  debug:
    msg:
      - "phpMyAdmin is accessible at:"
      - "  - Direct: http://{{ ansible_host }}:8080 (if port mapped)"
      - "  - Via Nginx: https://{{ domain_name }}/phpmyadmin"
      - "Login with MySQL root credentials:"
      - "  Username: root"
      - "  Password: {{ mysql_root_password }}"
