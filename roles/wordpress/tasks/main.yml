---
# WordPress Setup Role
- name: Create WordPress directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ app_wordpress_dir }}"
    - "{{ app_certs_dir }}"

- name: Clean up existing WordPress data
  shell: rm -rf {{ app_wordpress_dir }}/*
  ignore_errors: yes

- name: Generate self-signed SSL certificate
  shell: |
    openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    -keyout {{ app_certs_dir }}/nginx-selfsigned.key \
    -out {{ app_certs_dir }}/nginx-selfsigned.crt \
    -subj "/C=US/ST=State/L=City/O=Organization/CN={{ domain_name }}"
  args:
    creates: "{{ app_certs_dir }}/nginx-selfsigned.crt"

- name: Copy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_base_dir }}/docker-compose.yml"
    mode: '0644'

- name: Stop existing containers
  shell: docker-compose down --remove-orphans
  args:
    chdir: "{{ app_base_dir }}"
  ignore_errors: yes
  when: compose_file.stat.exists

- name: Start WordPress stack
  shell: docker-compose up -d
  args:
    chdir: "{{ app_base_dir }}"

- name: Wait for MariaDB container to be running
  shell: docker ps --filter "name=mysql" --filter "status=running" --format "{% raw %}{{.Names}}{% endraw %}"
  register: mysql_container
  until: mysql_container.stdout == "mysql"
  retries: 20
  delay: 3

- name: Wait for MariaDB to be fully ready
  shell: |
    for i in {1..60}; do
      if docker exec mysql mariadb-admin ping -h localhost -u root -p{{ mysql_root_password }} --silent 2>/dev/null; then
        sleep 10
        if docker exec mysql mariadb -u root -p{{ mysql_root_password }} -e "SELECT 1" 2>/dev/null | grep -q "1"; then
          echo "MariaDB is ready"
          exit 0
        fi
      fi
      sleep 3
    done
    exit 1
  register: mysql_ready
  retries: 3
  delay: 10
  until: mysql_ready.rc == 0

- name: Wait for WordPress container to be running
  shell: docker ps --filter "name=wordpress" --filter "status=running" --format "{% raw %}{{.Names}}{% endraw %}"
  register: wp_container
  until: wp_container.stdout == "wordpress"
  retries: 20
  delay: 3

- name: Wait for WordPress files to be initialized
  shell: docker exec wordpress test -f /var/www/html/wp-config.php && echo "exists" || echo "not exists"
  register: wp_config_check
  until: wp_config_check.stdout == "exists"
  retries: 30
  delay: 5

- name: Test database connection from WordPress
  shell: |
    docker exec wordpress php -r '
    $conn = new mysqli("mysql", "{{ mysql_user }}", "{{ mysql_password }}", "{{ mysql_database }}");
    if ($conn->connect_error) {
        echo "FAILED: " . $conn->connect_error;
        exit(1);
    }
    echo "SUCCESS: Connected to " . $conn->server_info;
    $conn->close();
    '
  register: php_db_test
  retries: 20
  delay: 5
  until: php_db_test.rc == 0 and "SUCCESS" in php_db_test.stdout

- name: Display database connection status
  debug:
    msg: "{{ php_db_test.stdout }}"

- name: Install WP-CLI in WordPress container
  shell: |
    docker exec wordpress bash -c "
    if [ ! -f /usr/local/bin/wp ]; then
      curl -sS -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && \
      chmod +x wp-cli.phar && \
      mv wp-cli.phar /usr/local/bin/wp
    fi"
  register: wpcli_install
  retries: 3
  delay: 5

- name: Check if WordPress is already installed
  shell: |
    docker exec wordpress bash -c "cd /var/www/html && wp core is-installed --allow-root 2>&1 && echo 'INSTALLED' || echo 'NOT_INSTALLED'"
  register: wp_check
  ignore_errors: yes

- name: Install WordPress using WP-CLI
  shell: |
    docker exec wordpress bash -c "
    cd /var/www/html
    wp core install \
      --url='https://{{ domain_name }}' \
      --title='WordPress Site' \
      --admin_user='{{ wordpress_admin_user }}' \
      --admin_password='{{ wordpress_admin_password }}' \
      --admin_email='{{ wordpress_admin_email }}' \
      --skip-email \
      --allow-root
    "
  register: wp_install_result
  when: "'NOT_INSTALLED' in wp_check.stdout"
  retries: 3
  delay: 10
  ignore_errors: yes

- name: Verify WordPress installation
  shell: |
    docker exec wordpress bash -c "cd /var/www/html && wp core is-installed --allow-root && echo 'SUCCESS' || echo 'FAILED'"
  register: final_check
  ignore_errors: yes

- name: Display WordPress installation status
  debug:
    msg: "WordPress installation: {{ final_check.stdout }}"