---
# AWS CloudFront CDN Setup

- name: Install AWS CLI
  pip:
    name: awscli
    state: present

- name: Create CloudFront distribution configuration
  template:
    src: cloudfront-config.json.j2
    dest: /tmp/cloudfront-config.json
    mode: '0644'

- name: Create CloudFront distribution
  shell: |
    aws cloudfront create-distribution \
      --distribution-config file:///tmp/cloudfront-config.json \
      --region us-east-1
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
  register: cloudfront_result
  ignore_errors: yes
  when: 
    - aws_access_key_id is defined
    - aws_secret_access_key is defined

- name: Display CloudFront setup information
  debug:
    msg:
      - "============ AWS CLOUDFRONT CDN ============"
      - "CloudFront distribution created (if credentials provided)"
      - "Update your DNS to point to CloudFront domain"
      - "Configure SSL certificate in CloudFront console"
      - "=========================================="